<style>
        .bouncy-pill {
            box-shadow: 0 4px 0 0 #a53b29;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bouncy-pill:active:not(:disabled) {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 0px 0 0 #a53b29;
        }
        .bouncy-pill:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 #a53b29;
            background-color: theme('colors.surface-variant');
            color: theme('colors.on-surface-variant');
        }
        .floating-doodle {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .game-cell {
            transition: background-color 0.2s;
        }
        .game-cell:hover:not(.occupied) {
            background-color: theme('colors.surface-container-low');
        }
        .cell-content {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 800;
            font-size: 4rem;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .cell-x { color: theme('colors.primary'); }
        .cell-o { color: theme('colors.secondary-container'); }
        
        /* Soft volume depth for cards */
        .card-depth {
            box-shadow: 0 10px 30px -10px rgba(255, 126, 103, 0.15);
        }

<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-2 transition-all duration-300 transform scale-105 active:translate-y-1 transition-all duration-200 ease-out" href="#">

<span class="font-label-caps text-label-caps uppercase tracking-widest">Surprise</span>
</a>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.game-cell');
            const nextButton = document.getElementById('next-button');
            const nextButtonText = document.getElementById('next-button-text');
            const nextButtonIcon = document.getElementById('next-button-icon');
            const statusDiv = document.getElementById('game-status');
            const nailongImg = document.getElementById('nailong-img');
            
            let board = ['', '', '', '', '', '', '', '', ''];
            let gameActive = true;
            let currentTurn = 'O';
            
            const wonImage = 'https://media1.tenor.com/m/G9Y2uNf_OQsAAAAC/dinosaur-cute.gif';
            const loseImage = 'https://i.pinimg.com/736x/87/42/70/874270bb3f3e1b7640f074d262b9aeb6.jpg';
            const thinkingImage = 'https://media.tenor.com/FwIq_q3h7OAAAAAj/nailong-dino.gif';

            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            function handleCellClick(e) {
                const cell = e.target.closest('.game-cell');
                const index = parseInt(cell.getAttribute('data-index'));

                if (board[index] !== '' || !gameActive || currentTurn !== 'O') return;

                // User Move (O)
                makeMove(index, 'O');

                if (checkWin('O')) {
                    endGame("You won! You can proceed.", wonImage, true);
                    return;
                }
                
                if (board.indexOf('') === -1) {
                    endGame("It's a draw!", thinkingImage, false);
                    return;
                }

                // AI Move (X) - Nailong thinking
                currentTurn = 'X';
                showThinking();

                setTimeout(() => {
                    if(!gameActive) return;
                    const emptyIndices = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
                    if (emptyIndices.length > 0) {
                        const randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                        makeMove(randomIndex, 'X');
                        
                        if (checkWin('X')) {
                            endGame("Nailong won! Try again.", loseImage, false);
                        } else if (board.indexOf('') === -1) {
                            endGame("It's a draw!", thinkingImage, false);
                        } else {
                            hideThinking();
                            currentTurn = 'O';
                        }
                    }
                }, 1000 + Math.random() * 500); // 1-1.5 second thinking time
            }

            function makeMove(index, player) {
                board[index] = player;
                const cell = document.querySelector(`.game-cell[data-index="${index}"]`);
                cell.classList.add('occupied');
                const cellClass = player === 'O' ? 'cell-o' : 'cell-x';
                cell.innerHTML = `<span class="cell-content ${cellClass}">${player}</span>`;
            }

            function checkWin(player) {
                return winningConditions.some(condition => {
                    return condition.every(index => board[index] === player);
                });
            }

            function showThinking() {
                nailongImg.src = thinkingImage;
                nailongImg.classList.remove('hidden');
                statusDiv.classList.add('hidden');
            }

            function hideThinking() {
                nailongImg.classList.add('hidden');
            }

            function endGame(message, imageSrc, isWin) {
                gameActive = false;
                statusDiv.textContent = message;
                statusDiv.classList.remove('hidden');
                
                if (imageSrc) {
                    nailongImg.src = imageSrc;
                    nailongImg.classList.remove('hidden');
                } else {
                    nailongImg.classList.add('hidden');
                }
                
                nextButton.removeAttribute('disabled');
                
                if (isWin) {
                    nextButton.style.backgroundColor = 'theme("colors.primary")';
                    nextButtonText.textContent = "Continue";
                    nextButtonIcon.textContent = "arrow_forward";
                    nextButton.onclick = () => window.location.href = '#';
                    triggerConfetti();
                } else {
                    nextButton.style.backgroundColor = 'theme("colors.outline")';
                    nextButtonText.textContent = "Try Again";
                    nextButtonIcon.textContent = "refresh";
                    nextButton.onclick = resetGame;
                }
            }
            
            function resetGame() {
                board = ['', '', '', '', '', '', '', '', ''];
                gameActive = true;
                currentTurn = 'O';
                statusDiv.classList.add('hidden');
                nailongImg.classList.add('hidden');
                cells.forEach(cell => {
                    cell.innerHTML = '';
                    cell.classList.remove('occupied');
                });
                
                nextButton.setAttribute('disabled', 'true');
                nextButton.style.backgroundColor = 'theme("colors.primary-container")';
                nextButtonText.textContent = "Continue";
                nextButtonIcon.textContent = "arrow_forward";
                nextButton.onclick = () => window.location.href = '#';
            }

            function triggerConfetti() {
                for(let i=0; i<30; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('material-symbols-outlined', 'absolute', 'text-secondary-container', 'z-50');
                    confetti.textContent = ['star', 'favorite', 'celebration'][Math.floor(Math.random()*3)];
                    confetti.style.left = '50%';
                    confetti.style.top = '30%';
                    confetti.style.fontSize = (Math.random() * 24 + 12) + 'px';
                    confetti.style.transition = 'all 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
                    confetti.style.color = ['#ff7e67', '#fdd73b', '#51b3b2', '#a53b29'][Math.floor(Math.random()*4)];
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        const tx = (Math.random()-0.5)*500;
                        const ty = (Math.random()-0.5)*500;
                        confetti.style.transform = `translate(${tx}px, ${ty}px) rotate(${Math.random()*720}deg) scale(${Math.random() + 0.5})`;
                        confetti.style.opacity = '0';
                    }, 50);
                    
                    setTimeout(() => confetti.remove(), 1550);
                }
            }

            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        });
    </script>
