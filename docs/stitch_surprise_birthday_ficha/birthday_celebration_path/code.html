<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.game-cell');
            const nextButton = document.getElementById('next-button');
            const statusDiv = document.getElementById('game-status');
            
            let board = ['', '', '', '', '', '', '', '', ''];
            let gameActive = true;
            
            // Simplified logic for UI demo - let user win easily or tie
            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            function handleCellClick(e) {
                const cell = e.target.closest('.game-cell');
                const index = parseInt(cell.getAttribute('data-index'));

                if (board[index] !== '' || !gameActive) return;

                // User Move (O)
                board[index] = 'O';
                cell.classList.add('occupied');
                cell.innerHTML = '<span class="cell-content cell-o">O</span>';

                if (checkWin('O')) {
                    endGame("You won! 🎉");
                    return;
                }
                
                if (board.indexOf('') === -1) {
                    endGame("It's a tie! 🤝");
                    return;
                }

                // AI Move (X) - Simple random move
                gameActive = false; // Pause user input
                setTimeout(() => {
                    const emptyIndices = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
                    if (emptyIndices.length > 0) {
                        const randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                        board[randomIndex] = 'X';
                        const aiCell = document.querySelector(`.game-cell[data-index="${randomIndex}"]`);
                        aiCell.classList.add('occupied');
                        aiCell.innerHTML = '<span class="cell-content cell-x">X</span>';
                        
                        if (checkWin('X')) {
                            endGame("I won! 😜");
                        } else if (board.indexOf('') === -1) {
                            endGame("It's a tie! 🤝");
                        } else {
                            gameActive = true;
                        }
                    }
                }, 500); // Slight delay for AI feel
            }

            function checkWin(player) {
                return winningConditions.some(condition => {
                    return condition.every(index => board[index] === player);
                });
            }

            function endGame(message) {
                gameActive = false;
                statusDiv.textContent = message;
                statusDiv.classList.remove('hidden');
                
                // Enable next button
                nextButton.removeAttribute('disabled');
                nextButton.style.backgroundColor = 'theme("colors.primary")'; // Re-apply intense color
                
                // Trigger celebratory confetti effect if won
                if(message.includes("won")) {
                    triggerConfetti();
                }
            }

            function triggerConfetti() {
                // Simple inline pseudo-confetti for the visual effect
                for(let i=0; i<15; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('material-symbols-outlined', 'absolute', 'text-secondary-container');
                    confetti.textContent = 'star';
                    confetti.style.left = '50%';
                    confetti.style.top = '50%';
                    confetti.style.fontSize = (Math.random() * 20 + 10) + 'px';
                    confetti.style.transition = 'all 1s ease-out';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.style.transform = `translate(${(Math.random()-0.5)*300}px, ${(Math.random()-0.5)*300}px) rotate(${Math.random()*360}deg)`;
                        confetti.style.opacity = '0';
                    }, 50);
                    
                    setTimeout(() => confetti.remove(), 1050);
                }
            }

            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        });
    </script>
