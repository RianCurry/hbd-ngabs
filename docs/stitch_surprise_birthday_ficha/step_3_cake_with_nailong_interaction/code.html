<style>
        /* Custom Styles & Animations */
        body {
            background-color: theme('colors.background');
            background-image: radial-gradient(circle at 50% 50%, rgba(253, 215, 59, 0.1) 0%, transparent 60%);

        .bouncy-pill {
            box-shadow: 0 4px 0 theme('colors.on-primary-container');
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bouncy-pill:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 2px 0 theme('colors.on-primary-container');
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(-5deg); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .floating-motif {
            animation: float 4s ease-in-out infinite;
        }
        
        .floating-motif-reverse {
            animation: float-reverse 5s ease-in-out infinite;
        }

        .snap-card {
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .shimmer-effect {
            position: relative;
            overflow: hidden;
        }
        .shimmer-effect::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        .candle-flame {
            position: absolute;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 30;
            transition: all 0.2s ease;
        }
        
        .candle-flame.unlit {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5);
        }

        .candle-flame::before {
            content: 'local_fire_department';
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 1;
            color: theme('colors.secondary-fixed');
            font-size: 24px;
            position: absolute;
            top: 0;
            left: 0;
            filter: drop-shadow(0 0 4px theme('colors.primary-container'));
            animation: flicker 0.3s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
        }

        @keyframes puff {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(2); opacity: 0; }
        }

        .smoke-puff {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: puff 0.6s ease-out forwards;

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const totalCandles = 21;
        let unlitCount = 0;
        
        const cakeContainer = document.getElementById('cake-container');
        const counterText = document.getElementById('candle-counter');
        const progressBar = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');
        const nextIcon = document.getElementById('next-icon');
        const instructionTitle = document.getElementById('instruction-title');
        
        // Accurate positions for the 21 flame bases mapped from the SVG
        const flamePositions = [
            // Top Tier
            {x: 27.5, y: 19}, {x: 33, y: 14}, {x: 38.5, y: 17}, {x: 44, y: 12}, 
            {x: 49.5, y: 17}, {x: 55, y: 15}, {x: 60.5, y: 21},
            
            // Middle/Bottom Tier
            {x: 19, y: 42}, {x: 24.5, y: 47}, {x: 31.5, y: 44}, {x: 38.5, y: 49}, 
            {x: 45.5, y: 44}, {x: 52.5, y: 47}, {x: 58, y: 42}, {x: 65, y: 45}, 
            {x: 70.5, y: 40}, {x: 17.5, y: 62}, {x: 28.5, y: 65}, {x: 41.5, y: 64}, 
            {x: 55.5, y: 67}, {x: 69.5, y: 62}
        ];

        function createPuff(x, y) {
            const puff = document.createElement('div');
            puff.className = 'smoke-puff';
            puff.style.left = `${x}%`;
            puff.style.top = `${y}%`;
            cakeContainer.appendChild(puff);
            setTimeout(() => puff.remove(), 600);
        }

        function updateProgress() {
            counterText.textContent = `${unlitCount} / ${totalCandles} lilin`;
            const percentage = (unlitCount / totalCandles) * 100;
            progressBar.style.width = `${percentage}%`;

            if (unlitCount === totalCandles) {
                instructionTitle.textContent = "Hore! Berhasil!";
                instructionTitle.classList.add('text-secondary');
                nextBtn.disabled = false;
                nextBtn.classList.remove('text-outline', 'opacity-50', 'cursor-not-allowed');
                nextBtn.classList.add('text-primary', 'hover:opacity-80');
                nextIcon.classList.add('group-hover:translate-x-1');
            }
        }

        flamePositions.forEach((pos, index) => {
            if (index >= totalCandles) return;
            const flame = document.createElement('div');
            flame.className = 'candle-flame';
            flame.style.left = `${pos.x}%`;
            flame.style.top = `${pos.y}%`;
            
            flame.addEventListener('click', () => {
                if (!flame.classList.contains('unlit')) {
                    flame.classList.add('unlit');
                    createPuff(pos.x, pos.y);
                    unlitCount++;
                    updateProgress();
                }
            });
            
            // Allow touch events as well
            flame.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!flame.classList.contains('unlit')) {
                    flame.classList.add('unlit');
                    createPuff(pos.x, pos.y);
                    unlitCount++;
                    updateProgress();
                }
            });
            
            cakeContainer.appendChild(flame);
        });
        
        // Initialize state
        updateProgress();
    });
</script>
