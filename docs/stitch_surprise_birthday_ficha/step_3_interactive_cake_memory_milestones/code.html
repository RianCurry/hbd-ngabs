            0% { transform: translateX(-100%); }

            position: relative;
            overflow: hidden;
        }
        .shimmer-effect::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;

        .candle-flame {
            position: absolute;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 30;
            transition: all 0.2s ease;
        }
        
        .candle-flame.unlit {
            opacity: 0;
            pointer-events: none;

            100% { transform: scale(1.1) rotate(2deg); opacity: 1; }

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const totalCandles = 21;
        let unlitCount = 0;
        
        const cakeContainer = document.getElementById('cake-container');
        const counterText = document.getElementById('candle-counter');
        const nextBtn = document.getElementById('next-btn');
        const instructionTitle = document.getElementById('instruction-title');
        const milestoneToast = document.getElementById('milestone-message');
        
        // Accurate positions for the 21 flame bases mapped from the SVG
        // Coordinates represent percentages of the SVG viewport (400x300)
        // x = (svgX / 320) * 100
        // y = ((svgY - 30) / 250) * 100
        const flamePositions = [
            // Top Tier Candles
            {x: 30.9, y: 8.5}, 
            {x: 37.2, y: 2.5}, 
            {x: 43.4, y: 6.5}, 
            {x: 49.7, y: 0.5}, 
            {x: 55.9, y: 6.5}, 
            {x: 62.2, y: 3.5}, 
            {x: 68.4, y: 10.5}, 
            
            // Middle Tier Candles
            {x: 21.5, y: 36.5}, 
            {x: 27.8, y: 42.5}, 
            {x: 35.6, y: 38.5}, 
            {x: 43.4, y: 44.5}, 
            {x: 51.2, y: 38.5}, 
            {x: 59.1, y: 42.5}, 
            {x: 65.3, y: 36.5}, 
            {x: 73.1, y: 40.5}, 
            {x: 79.4, y: 34.5}, 
            
            // Bottom Tier Candles
            {x: 20.0, y: 60.5}, 
            {x: 32.5, y: 64.5}, 
            {x: 46.5, y: 62.5}, 
            {x: 62.2, y: 66.5}, 
            {x: 77.8, y: 60.5}  
        ];

        const milestones = {
            10: "Umur 10: Awal masa puber & keceriaan!",
            15: "Umur 15: Semangat baru masuk MTS!",
            17: "Umur 17: Sweet Seventeen & masa SMK yang seru!",
            21: "Umur 21: Selamat datang di babak baru yang hebat!"
        };

        const genericMessages = [
            "Yey, satu lagi!",
            "Semangat tiupnya!",
            "Terus tiup...",
            "Good job!",
            "Hampir setengah!"
        ];

        function showMessage(msg) {
            milestoneToast.textContent = msg;
            milestoneToast.classList.add('show');
            setTimeout(() => {
                milestoneToast.classList.remove('show');
            }, 2500);
        }

        function createPuff(x, y) {
            const puff = document.createElement('div');
            puff.className = 'smoke-puff';
            puff.style.left = `${x}%`;
            puff.style.top = `${y}%`;
            cakeContainer.appendChild(puff);
            setTimeout(() => puff.remove(), 600);
        }

        function updateProgress() {
            counterText.textContent = `${unlitCount} / ${totalCandles} lilin`;

            if (milestones[unlitCount]) {
                showMessage(milestones[unlitCount]);
            } else if (unlitCount > 0 && unlitCount < 10 && unlitCount % 3 === 0) {
                 showMessage(genericMessages[Math.floor(Math.random() * genericMessages.length)]);
            }

            if (unlitCount === totalCandles) {
                instructionTitle.textContent = "Hore! Berhasil!";
                instructionTitle.classList.add('text-secondary');
                nextBtn.classList.remove('hidden');
                nextBtn.classList.add('flex');
            }
        }

        flamePositions.forEach((pos, index) => {
            if (index >= totalCandles) return;
            // Select existing flames instead of creating new ones if they are present in HTML, 
            // but the prompt HTML already has them hardcoded. We need to attach listeners to the existing ones.
        });
        
        // Attach to existing flames
        const existingFlames = document.querySelectorAll('.candle-flame');
        existingFlames.forEach((flame, index) => {
            if(index >= flamePositions.length) return;
            const pos = flamePositions[index];
            
            const extinguish = (e) => {
                if(e) e.preventDefault();
                if (!flame.classList.contains('unlit')) {
                    flame.classList.add('unlit');
                    createPuff(pos.x, pos.y);
                    unlitCount++;
                    updateProgress();
                }
            };
            
            flame.addEventListener('click', extinguish);
            flame.addEventListener('touchstart', extinguish);
        });
        
        // Initialize state
        updateProgress();
    });
</script>
</body></html>
