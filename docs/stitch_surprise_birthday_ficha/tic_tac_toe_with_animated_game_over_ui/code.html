<style>
        .bouncy-pill {

            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

        .bouncy-pill:disabled {

        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;

        @keyframes popIn {

        @keyframes vibrate {
            0% { transform: translate(0); }

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.game-cell');
            const nailongImg = document.getElementById('nailong-img');
            
            const modal = document.getElementById('endgame-modal');
            const modalImg = document.getElementById('modal-img');
            const modalStatus = document.getElementById('modal-status');
            const modalReplayButton = document.getElementById('modal-replay-button');
            const modalNextButton = document.getElementById('modal-next-button');
            
            let board = ['', '', '', '', '', '', '', '', ''];
            let gameActive = true;
            
            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            function handleCellClick(e) {
                const cell = e.target.closest('.game-cell');
                const index = parseInt(cell.getAttribute('data-index'));

                if (board[index] !== '' || !gameActive) return;

                // User Move (X)
                board[index] = 'X';
                cell.classList.add('occupied');
                cell.innerHTML = '<span class="cell-content cell-x">X</span>';

                if (checkWin('X')) {
                    endGame("Kamu menang! Lanjutkan ke kejutan?", 'https://lh3.googleusercontent.com/aida-public/AB6AXuB2rXC97CauHCt-zT-SMmyVMNOCKOY8um1S3UVlfR6NjKpOHHBHuChrHEKWiYh_Mn1fVPDHiOPKF6TiRzr2e1Q5a_SMKpD0qTWr6bjiwjc1c4Z1QJD8Mvt4hPai71d9dAXM42J0o4oYgTJdUL5xLKgs0cMdMBE5IyHpCEpEHYH99YdyM9dlEMjzZrpxYIRx1MQMYvhNwH7M_3wNBF3ZbRxzOw3r5o0EhYorM0oe_I0TzfG_esR_xQHht1CCCu5GCtqfLA');
                    return;
                }
                
                if (board.indexOf('') === -1) {
                    endGame("Seri! Coba lagi?", 'https://lh3.googleusercontent.com/aida-public/AB6AXuChC31ecBVD8p6JRDL5XsBfwOOdDpLTmI7vASAjHg5U2nHVlk3nlmeRO6mwbUSI1qiN2xHA7S-Dgc59rC7Qq4MKbYSpK5EKpqmxQa4YLY9zXCE2INZH2jgtp5-w8-e6FOXyEArNC6203vVDf4a-swwtI_dP_iwI3ALfMd-qUY69FDW2Mm2-M2GVleUtU3Da6T_axYiIQFhIZR_pj05ZVWo9oCFa0u4rsB3eEe7gRsFmJS4E1pQ5txqe0xu4lBBA-qR2uQ');
                    return;
                }

                // AI Move (O) - Nailong thinking
                gameActive = false; // Pause user input
                showThinking();

                setTimeout(() => {
                    const emptyIndices = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
                    if (emptyIndices.length > 0) {
                        const randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                        board[randomIndex] = 'O';
                        const aiCell = document.querySelector(`.game-cell[data-index="${randomIndex}"]`);
                        aiCell.classList.add('occupied');
                        aiCell.innerHTML = '<span class="cell-content cell-o">O</span>';
                        
                        hideThinking();
                        
                        if (checkWin('O')) {
                            endGame("Nailong menang! Coba lagi?", 'https://lh3.googleusercontent.com/aida-public/AB6AXuAcRLx-Yzns_6w_UUfmhFYIZwnWb9lTcbeKeWIojbpIp9U0r4TyNeBbC-OFRS5_uHR7I3sOT12QRm-CbnB9qPs4VPCldYvnbafK86kBYovD2eZjKlvw5sSh2PIGBhz69QdiV9Bl7MdJxGhenxmnvEEYrwerbStuSaGHHwNT64H6yPjx6MxMpx_RM-UFdU813GTMEmRA8bnz0QUdqDqxGsBI5rms-19rvW4YIqrf4pf6Zz-1gu-2txz9isC4hdlTJ4W4pw');
                        } else if (board.indexOf('') === -1) {
                            endGame("Seri! Coba lagi?", 'https://lh3.googleusercontent.com/aida-public/AB6AXuDXFr8w4A4VapO9YCZbxMfbGCaslOeMiYJ4PfCLW2jFvWT5FlZI7R6ucLoE6L3TG5mOSNfcfpJ5ed6wk1i0ohJEu3WwcIIWKnsy168ES7L0DngUPpwlEZgjdsNkcCyBjdsGBs3u6GbIYayJYhSj4IJwwpdrgK0ghmjQ2cYvfidgAiiVLtCpjt-p1rl9gEwUGswbFQ2DbnWrZQSAyNl5wY0JTGVtsr746JBMNYoe8lBulqqo9hTBEkBDzzCuIbsdkknE5Q');
                        } else {
                            gameActive = true;
                        }
                    }
                }, 1000); // 1 second thinking time
            }

            function checkWin(player) {
                return winningConditions.some(condition => {
                    return condition.every(index => board[index] === player);
                });
            }

            function showThinking() {
                nailongImg.src = 'https://lh3.googleusercontent.com/aida-public/AB6AXuAfHoTp0PGAk7PELnHKs7qUvgB8AhITiEnGLhdXeeiZQyiQdhnXL-1QV24XbWoTtOLOm61Iks6cEYtXbPgjEqMGoettKIteyvhqyU85brxQ-AisTSY9lSAn4rMqMN_excTkio1ecSYVlfjoRTsSfcjCas3mDhFrEcYsMqxmy1ULnf4v8hKUOu5yMuGIrXLHendXvrCUvbNPEUmjiSGGrfqJgGEyqFmw9csB_WtKYYlqIIxxCc5S_-EhHdIG1AN2DgVw0Q';
                nailongImg.classList.remove('hidden');
            }

            function hideThinking() {
                nailongImg.classList.add('hidden');
            }

            function endGame(message, imageSrc) {
                gameActive = false;
                
                modalStatus.textContent = message;
                modalImg.src = imageSrc;
                
                // Trigger vibrate animation
                modalImg.classList.remove('vibrate');
                void modalImg.offsetWidth; // Trigger reflow
                modalImg.classList.add('vibrate');
                
                if(message.includes("Kamu menang")) {
                    modalNextButton.classList.remove('hidden');
                    modalReplayButton.classList.add('hidden');
                    triggerConfetti();
                } else {
                    modalNextButton.classList.add('hidden');
                    modalReplayButton.classList.remove('hidden');
                }
                
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
            
            function resetGame() {
                board = ['', '', '', '', '', '', '', '', ''];
                gameActive = true;
                
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                
                cells.forEach(cell => {
                    cell.innerHTML = '';
                    cell.classList.remove('occupied');
                });
            }

            function triggerConfetti() {
                for(let i=0; i<30; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('material-symbols-outlined', 'absolute', 'text-secondary-container', 'z-50');
                    confetti.textContent = ['star', 'favorite', 'celebration'][Math.floor(Math.random()*3)];
                    confetti.style.left = '50%';
                    confetti.style.top = '30%';
                    confetti.style.fontSize = (Math.random() * 24 + 12) + 'px';
                    confetti.style.transition = 'all 1.5s cubic-bezier(0.25, 1, 0.5, 1)';
                    confetti.style.color = ['#ff7e67', '#fdd73b', '#51b3b2', '#a53b29'][Math.floor(Math.random()*4)];
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        const tx = (Math.random()-0.5)*500;
                        const ty = (Math.random()-0.5)*500;
                        confetti.style.transform = `translate(${tx}px, ${ty}px) rotate(${Math.random()*720}deg) scale(${Math.random() + 0.5})`;
                        confetti.style.opacity = '0';
                    }, 50);
                    
                    setTimeout(() => confetti.remove(), 1550);
                }
            }

            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
            modalReplayButton.addEventListener('click', resetGame);
        });
    </script>
